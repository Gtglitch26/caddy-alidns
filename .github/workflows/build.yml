name: Build Caddy AliDNS

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build.yml

  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Caddy with AliDNS
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gtglitch26/caddy-alidns:latest
            ghcr.io/gtglitch26/caddy-alidns:build-${{ github.run_number }}
